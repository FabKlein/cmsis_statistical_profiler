# ----------------------------------------------------------------------
# Project:      CMSIS Statistical Profiler
# Title:        systick.clayer.yml
# Description:  Exclusive SysTick sampling timer layer
#
# $Date:        22 September 2026
# $Revision:    V.1.0.0
#
# Target :  Arm(R) M-Profile Architecture
#
# ----------------------------------------------------------------------

layer:
  description: Reserve SysTick exclusively for profiling (no HAL or RTOS tick)
  type: ProfilerTimer
  groups:
    - group: Profiler sampling timer
      # Restrict ISR code generation without changing application optimization.
      misc:
        - for-compiler: AC6
          C:
            - -fno-vectorize
            - -fno-slp-vectorize
        - for-compiler: GCC
          C:
            - -fno-tree-vectorize
      files:
        - file: ./profiler_systick.c
