# ----------------------------------------------------------------------
# Project:      CMSIS Statistical Profiler
# Title:        cmsis_statistical_profiler.clayer.yml
# Description:  Common capture core, Cortex-M backend and application settings
#
# $Date:        25 September 2026
# $Revision:    V.1.0.2
#
# Target :  Arm(R) M-Profile Architecture
#
# ----------------------------------------------------------------------

layer:
  description: Statistical capture core and Cortex-M backend (select 1 board and 1 timer)
  type: Profiler
  # Configure in the application cproject.yml, not this dependency.
  # Defaults live in mcu/sampling_profiler_config.h. Example project definitions:
  # define:
    # - PROFILER_SAMPLE_HZ: 1000             # Requested samples/second.
    # - PROFILER_SAMPLE_BUFFER_BYTES: 65536  # RAM budget, including header; stops when full.
    # Backtraces: enable both options below; requires unwind tables and bounds hooks.
    # Storage: 4-byte metadata + 4 bytes/caller. Setup: docs/UNWINDING.md.
    # - PROFILER_UNWIND_MAX_DEPTH: 16        # Caller limit; only recovered callers are stored.
    # - PROFILER_STACK_UNWIND: 1           # Collect EHABI caller chains.
    # - PROFILER_PRECISE_STACK_BOUNDS: 1   # Validate against the interrupted task's stack.
    # Optional: 0–4 32-bit events, each using 2 chained hardware counters.
    # Unavailable CPUs keep PC sampling; the capture reports PMU unavailable.
    # - PROFILER_PMU_COUNT: 2  # 0 disables collection; use 4 for all events below
    # - PROFILER_PMU_EVENT0: 0x0003  # ARM_PMU_L1D_CACHE_REFILL
    # - PROFILER_PMU_EVENT1: 0x0024  # ARM_PMU_STALL_BACKEND
    # - PROFILER_PMU_EVENT2: 0x0008  # ARM_PMU_INST_RETIRED
    # - PROFILER_PMU_EVENT3: 0x0011  # ARM_PMU_CPU_CYCLES
    #
    # Useful architectural PMU events (CMSIS names have the ARM_PMU_ prefix):
    # | Hex    | CMSIS event name | Meaning                                      |
    # |--------|------------------|----------------------------------------------|
    # | 0x0001 | L1I_CACHE_REFILL | L1 instruction-cache refills                 |
    # | 0x0003 | L1D_CACHE_REFILL | L1 data-cache refills                        |
    # | 0x0004 | L1D_CACHE        | L1 data-cache accesses                       |
    # | 0x0006 | LD_RETIRED       | Architecturally executed memory-read instrs  |
    # | 0x0007 | ST_RETIRED       | Architecturally executed memory-write instrs |
    # | 0x0008 | INST_RETIRED     | Architecturally executed instructions        |
    # | 0x0011 | CPU_CYCLES       | CPU cycles                                   |
    # | 0x0015 | L1D_CACHE_WB     | L1 data-cache write-backs                    |
    # | 0x0023 | STALL_FRONTEND   | No operation issued because of the frontend  |
    # | 0x0024 | STALL_BACKEND    | No operation issued because of the backend   |
    # Event support and detailed semantics depend on the CPU implementation.
    # Codes select events, not physical counter indices. Choose up to 4 per run;
    # each uses a pair of 16-bit hardware counters for 1 32-bit measurement.

  add-path:
    - ./mcu

  groups:
    - group: Statistical profiler
      # Keep the sampling ISR integer-only: automatic vectorization can introduce
      # FP/MVE instructions, triggering lazy FP context saving and adding stack use
      # and variable interrupt latency. This reduces profiler overhead and sampling
      # disturbance. These flags do not forbid explicit FP/MVE code; keep it out of
      # the ISR path and inspect generated code after compiler or LTO changes.
      misc:
        - for-compiler: AC6
          C:
            - -fno-vectorize
            - -fno-slp-vectorize
        - for-compiler: GCC
          C:
            - -fno-tree-vectorize
      files:
        - file: ./mcu/sampling_profiler.c
        - file: ./mcu/sampling_profiler_cortex_m.c
        - file: ./mcu/sampling_profiler_pmu.c
        - file: ./mcu/sampling_profiler_unwind.c
