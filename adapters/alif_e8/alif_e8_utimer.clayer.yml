# ----------------------------------------------------------------------
# Project:      CMSIS Statistical Profiler
# Title:        alif_e8_utimer.clayer.yml
# Description:  Alif Ensemble E8 per-core UTIMER sampling adapter layer
#
# $Date:        22 September 2026
# $Revision:    V.1.0.0
#
# Target :  Arm(R) M-Profile Architecture
#
# ----------------------------------------------------------------------

layer:
  description: Reserve 1 Alif UTIMER channel and IRQ per core
  type: ProfilerTimer
  # Default: RTSS_HP uses channel 0; RTSS_HE uses channel 1.
  # Startup must enable the chosen clocks before either core initializes profiling.
  # Override per image if those channels are occupied; choose distinct channels.
  # define:
  #   - PROFILER_ALIF_UTIMER_CHANNEL: 0
  groups:
    - group: Profiler sampling timer
      # Restrict ISR code generation without changing application optimization.
      misc:
        - for-compiler: AC6
          C:
            - -fno-vectorize
            - -fno-slp-vectorize
        - for-compiler: GCC
          C:
            - -fno-tree-vectorize
      files:
        - file: ./profiler_utimer.c
