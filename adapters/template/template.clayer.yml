layer:
  description: New board adapter template (edit device header)
  type: ProfilerAdapter
  define:
    - PROFILER_DEVICE_HEADER: '"your_device.h"'
    # Optional: SDK-derived defaults for CPU-readable stack RAM (SRAM or TCM).
    # - PROFILER_DEFAULT_STACK_BASE: YOUR_SDK_RAM_BASE
    # - PROFILER_DEFAULT_STACK_BYTES: YOUR_SDK_RAM_SIZE
    # Alternatively, for DTCM with a hardware-reported size:
    # - PROFILER_DEFAULT_DTCM_BASE: YOUR_SDK_DTCM_BASE
  add-path:
    - .
