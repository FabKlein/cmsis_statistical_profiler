layer:
  description: stm32n6 statistical profiler adapter (secure Cortex-M55)
  type: ProfilerAdapter
  define:
    - PROFILER_DEVICE_HEADER: '"stm32n6xx.h"'
    - PROFILER_DEFAULT_DTCM_BASE: DTCM_BASE_S
    # CMSIS DTCMCR supplies the configured size at initialization.
  add-path:
    - .
