# ----------------------------------------------------------------------
# Project:      CMSIS Statistical Profiler
# Title:        ethosu_trace.clayer.yml
# Description:  Optional Ethos-U statistical trace layer
#
# $Date:        5 October 2026
# $Revision:    V.1.0.1
#
# Target :  Arm(R) M-Profile Architecture
#
# ----------------------------------------------------------------------

layer:
  type: ProfilerCompanion
  description: Optional Ethos-U55/U65/U85 trace in a separate buffer
  add-path:
    - .
  groups:
    - group: Ethos-U statistical trace
      # Sampling runs in the timer ISR; avoid compiler-generated FP/MVE work.
      misc:
        - for-compiler: AC6
          C:
            - -fno-vectorize
            - -fno-slp-vectorize
        - for-compiler: CLANG
          C:
            - -fno-vectorize
            - -fno-slp-vectorize
        - for-compiler: GCC
          C:
            - -fno-tree-vectorize
      files:
        - file: ./ethosu_trace.c
