layer:
  description: corstone300 statistical profiler adapter (secure Cortex-M55)
  type: ProfilerAdapter
  define:
    - PROFILER_DEVICE_HEADER: '"SSE300MPS3.h"'
    - PROFILER_DEFAULT_STACK_BASE: DTCM0_BASE_S
    - PROFILER_DEFAULT_STACK_BYTES: (DTCM_BLK_SIZE * DTCM_BLK_NUM)
  add-path:
    - .
